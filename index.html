<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تومارا نەهاتنێ — پۆرتی یا مامۆستای</title>
<link rel="stylesheet" href="portal.css">
<base target="_blank">
</head>
<body>

<header class="site-header">
  <div class="logo-badge">ACI</div>
  <div class="header-text">
    <h1 id="hInstName">پەیمانگەها کومپیوتەرێ ل ئاکرێ</h1>
    <p id="hSub">سیستەما تومارکرنا نەهاتنێ</p>
    <p id="hYear"></p>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('ku')">کوردی</button>
    <button class="lang-btn" onclick="setLang('ar')">عربي</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
  <div class="header-user">
    <div class="user-pill"><span class="dot"></span><span id="headerUserName"></span></div>
    <button class="btn-logout" onclick="doLogout()" id="btnLogout">🚪</button>
  </div>
</header>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><p id="loadingText"></p></div>
</div>
<div class="toast" id="toast"></div>

<!-- Day status banner (non-working day) -->
<div class="day-banner" id="dayBanner" style="display:none"></div>

<!-- ═══ STICKY SESSION BAR: class / subject / lecture = ONE tap each ═══ -->
<div class="session-bar" id="sessionBar">
  <div class="sb-row">
    <span class="sb-label" id="lblClass">🏫 پۆل</span>
    <div class="chips" id="classChips"></div>
  </div>
  <div class="sb-row">
    <span class="sb-label" id="lblSubject">📚 بابەت</span>
    <div class="chips" id="subjectChips"></div>
  </div>
  <div class="sb-row">
    <span class="sb-label" id="lblLecture">⏱ وانە</span>
    <div class="chips" id="lectureChips"></div>
    <span class="sb-date" id="sbDate"></span>
  </div>
</div>

<main>
  <div class="form-wrap" id="screenSubmit" style="display:none">

    <!-- Current selection summary -->
    <div class="now-card" id="nowCard">
      <div class="now-main" id="nowMain">—</div>
      <div class="now-sub" id="nowSub"></div>
    </div>

    <!-- Last submission mini-banner -->
    <div class="last-banner" id="lastBanner" style="display:none">
      <span id="lastBannerText"></span>
      <button class="lb-close" onclick="document.getElementById('lastBanner').style.display='none'">✕</button>
    </div>

    <!-- Students -->
    <div class="card">
      <div class="card-header students-header">
        <div>
          <h3 id="studentsTitle">📋 قوتابیان</h3>
          <div class="student-hint" id="studentsHint"></div>
        </div>
        <div class="header-tools">
          <button class="tool-btn" id="btnSelectAll" onclick="selectAllStudents()">☑ هەمی</button>
          <button class="tool-btn" id="btnClearAll" onclick="clearAllStudents()">☐ هیچ</button>
        </div>
      </div>
      <div class="card-body students-body">
        <div class="students-area">
          <div class="students-area-header">
            <div><h4 id="studentsAreaTitle"></h4></div>
            <span class="students-count" id="absentCount">0</span>
          </div>
          <div id="studentsContainer">
            <div class="no-students"><span class="icon">🎓</span><span id="noStudentsText"></span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent submissions (collapsible) -->
    <details class="recent-wrap" id="recentWrap" style="display:none">
      <summary class="recent-summary">
        <span>📋 <span id="recentTitle"></span></span>
        <span class="recent-count-badge" id="recentCountBadge">0</span>
      </summary>
      <div id="recentCardBody"></div>
    </details>

  </div>
</main>

<!-- ═══ STICKY ACTION BAR: the two buttons a teacher actually needs ═══ -->
<div class="action-bar" id="actionBar" style="display:none">
  <button class="btn-all-present" id="btnAllPresent" onclick="submitForm(true)">
    <span class="big" id="allPresentText">✅ هەمی هاتینە</span>
    <span class="small" id="allPresentSub"></span>
  </button>
  <button class="btn-submit-absent" id="btnSubmit" onclick="submitForm(false)">
    <span class="big" id="submitText">📤 شاندن</span>
    <span class="small" id="submitSub"></span>
  </button>
</div>

<!-- Delete confirm -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <h3 id="confirmTitle"></h3>
    <p id="confirmMsg"></p>
    <div class="confirm-btns">
      <button class="btn-conf-cancel" id="confirmCancelBtn" onclick="closeConfirm()"></button>
      <button class="btn-conf-delete" id="confirmDeleteBtn" onclick="executeDelete()"></button>
    </div>
  </div>
</div>

let currentLang = localStorage.getItem('aci_lang') || 'ku';
let currentTeacher = null;
let STUDENTS = {};
let CLASS_SUBJECT_MAP = {};
let WORKING_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday'];
let selectedAbsent = new Set();
let todayRows = [];
let pendingDeleteRow = null;
let pendingEditRow = null;

// Session selections — locked in place, auto-advance lecture after submit
let sel = { cls:'', subject:'', lecture:'' };
const stateKey = () => 'aci_tstate_' + (currentTeacher ? currentTeacher.username : '');

// ── basics ─────────────────────────────────────────────
function getAcademicYear(){const n=new Date(),y=n.getFullYear();return n.getMonth()>=8?y+'-'+(y+1):(y-1)+'-'+y;}
function token(){return sessionStorage.getItem('aci_token')||'';}
function checkAuth(){
  if(!token()||sessionStorage.getItem('aci_role')!=='teacher'){window.location.href=LOGIN_URL;return false;}
  try{currentTeacher=JSON.parse(sessionStorage.getItem('aci_teacher')||'null');}catch(e){currentTeacher=null;}
  if(!currentTeacher){window.location.href=LOGIN_URL;return false;}
  return true;
}
function doLogout(){sessionStorage.clear();sessionStorage.setItem('explicit_logout','1');window.location.href=LOGIN_URL;}
async function apiGet(params){
  const q=new URLSearchParams(params||{});q.set('token',token());
  const resp=await fetch(`${SCRIPT_URL}?${q.toString()}`,{method:'GET',cache:'no-store'});
  const text=(await resp.text()).trim();
  if(!text) throw new Error('empty');
  let data;try{data=JSON.parse(text);}catch(_){return text;}
  if(data&&(data.error==='Unauthorized'||data.error==='unauthorized')) throw new Error('Unauthorized');
  return data;
}
function normalize(v){return String(v==null?'':v).trim().toLowerCase();}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDateForDisplay(iso){const p=String(iso).split('-');return p.length===3?`${parseInt(p[1])}/${parseInt(p[2])}/${p[0]}`:iso;}
function isWorkingDay(){return WORKING_DAYS.some(d=>normalize(d)===normalize(DAY_NAMES[new Date().getDay()]));}
function getSubjectsForClass(cls){
  if(CLASS_SUBJECT_MAP[cls]) return CLASS_SUBJECT_MAP[cls];
  const m=String(cls).toLowerCase().match(/^(\d+)([a-z]+)$/);
  if(m&&m[2].length===1&&CLASS_SUBJECT_MAP[m[1]]) return CLASS_SUBJECT_MAP[m[1]];
  return [];
}

// ── toast / loading ────────────────────────────────────
let toastTimer;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
function showLoading(msg){document.getElementById('loadingText').textContent=msg||'...';document.getElementById('loadingOverlay').classList.add('show');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show');}

// ── language ───────────────────────────────────────────
function setLang(lang){
  if(!LANGS[lang])return;
  currentLang=lang;localStorage.setItem('aci_lang',lang);
  const L=LANGS[lang];
  document.documentElement.dir=L.dir;
  document.documentElement.lang=L.htmlLang;
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('hInstName',L.hInstName);set('hSub',L.hSub);
  set('hYear',`${L.academicYearLabel}: ${getAcademicYear()}`);
  set('lblClass',L.lblClass);set('lblSubject',L.lblSubject);set('lblLecture',L.lblLecture);
  set('studentsTitle',L.studentsTitle);set('studentsHint',L.studentsHint);
  set('noStudentsText',sel.cls?L.noStudents:L.selectClassFirst);
  set('btnLogout',L.btnLogout);
  set('allPresentText',L.btnAllPresent);set('allPresentSub',L.allPresentSub);
  set('recentTitle',L.recentTitle);
  set('confirmTitle',L.confirmTitle);set('confirmMsg',L.confirmMsg);
  set('confirmCancelBtn',L.confirmCancel);set('confirmDeleteBtn',L.confirmDelete);
  set('sbDate','📅 '+formatDateForDisplay(todayISO()));
  const name=currentTeacher?(currentTeacher.arabicName||currentTeacher.displayName||currentTeacher.username):'';
  set('headerUserName',name);
  document.querySelectorAll('.lang-btn').forEach((b,i)=>b.classList.toggle('active',['ku','ar','en'][i]===lang));
  renderDayBanner();renderNowCard();updateButtons();renderStudents();renderRecentRows();
}

// ── day banner ─────────────────────────────────────────
function renderDayBanner(){
  const b=document.getElementById('dayBanner');
  const L=LANGS[currentLang];
  if(isWorkingDay()){b.style.display='none';return;}
  b.style.display='block';
  b.innerHTML=`<span>${L.dayOff}</span><span class="db-date">📅 ${formatDateForDisplay(todayISO())}</span>`;
}

// ── chips ──────────────────────────────────────────────
function makeChips(containerId,items,selected,onPick,labelFn){
  const el=document.getElementById(containerId);
  el.innerHTML='';
  items.forEach(item=>{
    const b=document.createElement('button');
    b.className='chip'+(normalize(item)===normalize(selected)?' active':'');
    b.textContent=labelFn?labelFn(item):item;
    b.onclick=()=>onPick(item);
    el.appendChild(b);
  });
}
function renderClassChips(){
  const classes=(currentTeacher&&currentTeacher.classes)||[];
  makeChips('classChips',classes,sel.cls,c=>{sel.cls=c;onSessionChange('cls');},null);
}
function renderSubjectChips(){
  const assigned=((currentTeacher&&currentTeacher.subjects)||[]);
  let allowed=assigned;
  if(sel.cls){
    const classSubs=getSubjectsForClass(sel.cls).map(normalize);
    allowed=assigned.filter(s=>classSubs.includes(normalize(s)));
  }
  makeChips('subjectChips',allowed,sel.subject,s=>{sel.subject=s;onSessionChange('subject');},null);
}
function renderLectureChips(){
  makeChips('lectureChips',LECTURE_OPTIONS,sel.lecture,l=>{sel.lecture=l;onSessionChange('lecture');},l=>l.replace('Lecture','').replace('(Merged)','⇄').replace('Lectures','').trim());
}
function onSessionChange(what){
  if(what==='cls'){
    const subs=((currentTeacher&&currentTeacher.subjects)||[]).map(normalize);
    const allowed=sel.cls?getSubjectsForClass(sel.cls):[];
    if(!allowed.some(s=>normalize(s)===normalize(sel.subject)&&subs.includes(normalize(s)))){
      const first=allowed.find(s=>subs.includes(normalize(s)));
      sel.subject=first||'';
    }
    selectedAbsent.clear();pendingEditRow=null;
    renderSubjectChips();renderStudents();updateButtons();
  }
  if(what==='lecture'&&pendingEditRow){pendingEditRow=null;updateButtons();}
  saveSessionState();renderNowCard();renderClassChips();renderLectureChips();
}
function saveSessionState(){
  if(!currentTeacher)return;
  sessionStorage.setItem(stateKey(),JSON.stringify({cls:sel.cls,subject:sel.subject,lecture:sel.lecture}));
}
function restoreSessionState(){
  try{
    const s=JSON.parse(sessionStorage.getItem(stateKey())||'null');
    if(s){sel.cls=s.cls||'';sel.subject=s.subject||'';sel.lecture=s.lecture||'';}
  }catch(_){}
}

// ── now card ───────────────────────────────────────────
function renderNowCard(){
  const L=LANGS[currentLang];
  const main=document.getElementById('nowMain'),sub=document.getElementById('nowSub');
  if(!sel.cls||!sel.subject||!sel.lecture){
    main.textContent='⬆️ '+L.nowWaiting;sub.textContent='';
    return;
  }
  main.textContent=`${sel.cls}  •  ${sel.subject}  •  ${sel.lecture}`;
  const total=sel.cls&&STUDENTS[sel.cls]?STUDENTS[sel.cls].length:0;
  sub.textContent=`📅 ${formatDateForDisplay(todayISO())}  •  ${total} ${L.studentsWord}  •  ${pendingEditRow?'✏️':'•'}`;
}

// ── students ───────────────────────────────────────────
function renderStudents(preSelected){
  const L=LANGS[currentLang];
  const con=document.getElementById('studentsContainer');
  const selected=preSelected||selectedAbsent;
  if(!sel.cls||!Array.isArray(STUDENTS[sel.cls])){
    con.innerHTML=`<div class="no-students"><span class="icon">🎓</span><span>${L.noStudents}</span></div>`;
    document.getElementById('studentsAreaTitle').textContent=L.selectClassFirst;
    updateAbsentCount();return;
  }
  const list=STUDENTS[sel.cls];
  document.getElementById('studentsAreaTitle').textContent=`${sel.cls} — ${list.length} ${L.studentsWord}`;
  const grid=document.createElement('div');grid.className='students-grid';
  list.forEach((name,i)=>{
    const row=document.createElement('button');
    row.type='button';
    row.className='student-check'+(selected.has(name)?' checked':'');
    row.innerHTML=`<span class="student-no">${String(i+1).padStart(2,'0')}</span><span class="sname"></span>`;
    row.querySelector('.sname').textContent=name;
    row.onclick=()=>{
      if(selectedAbsent.has(name))selectedAbsent.delete(name);else selectedAbsent.add(name);
      row.classList.toggle('checked',selectedAbsent.has(name));
      updateAbsentCount();updateButtons();
    };
    grid.appendChild(row);
  });
  con.innerHTML='';con.appendChild(grid);
  updateAbsentCount();
}
function selectAllStudents(){if(!sel.cls)return;STUDENTS[sel.cls].forEach(n=>selectedAbsent.add(n));renderStudents();updateButtons();}
function clearAllStudents(){selectedAbsent.clear();renderStudents();updateButtons();}
function updateAbsentCount(){
  const L=LANGS[currentLang];
  document.getElementById('absentCount').textContent=`${selectedAbsent.size} ${L.absentLabel}`;
}

// ── action bar ─────────────────────────────────────────
function updateButtons(){
  const L=LANGS[currentLang];
  const ready=sel.cls&&sel.subject&&sel.lecture;
  const off=!isWorkingDay();
  const submit=document.getElementById('btnSubmit');
  const allP=document.getElementById('btnAllPresent');
  document.getElementById('submitText').textContent=pendingEditRow?L.editMode:L.btnSubmit;
  document.getElementById('submitSub').textContent=ready?`${selectedAbsent.size} ${L.absentLabel}`:L.selectClassFirst;
  submit.disabled=!ready||off;
  allP.disabled=!ready||off;
  submit.classList.toggle('armed',selectedAbsent.size>0);
}

// ── submit ─────────────────────────────────────────────
function localDupKey(){return `aci_dup_${currentTeacher.username}_${todayISO()}_${sel.cls}_${sel.subject}_${sel.lecture}`;}
function isLocalDup(){return !!sessionStorage.getItem(localDupKey());}
function markLocalDup(){sessionStorage.setItem(localDupKey(),'1');}
function clearLocalDup(cls,subject,lecture){sessionStorage.removeItem(`aci_dup_${currentTeacher.username}_${todayISO()}_${cls}_${subject}_${lecture}`);}

async function submitForm(allPresent){
  const L=LANGS[currentLang];
  if(!sel.cls||!sel.subject||!sel.lecture){showToast(L.toastFill,'error');return;}
  if(!isWorkingDay()){showToast(L.toastWeekend,'error');return;}
  if(!pendingEditRow&&isLocalDup()){showToast(L.toastDuplicate,'error');autoAdvanceLecture();return;}

  showLoading(L.loadingSubmit);
  try{
    const response=await apiGet({
      action:pendingEditRow?'updateAbsence':'saveAbsence',
      rowNumber:pendingEditRow?String(pendingEditRow.rowNumber):'',
      date:formatDateForDisplay(todayISO()),
      subject:sel.subject,lectureNo:sel.lecture,classGroup:sel.cls,
      absentStudents:allPresent?'':[...selectedAbsent].join(', ')
    });
    const text=typeof response==='string'?response:'';
    if(text.startsWith('BLOCKED')){hideLoading();showToast(L.toastWeekend,'error');return;}
    if(text==='DUPLICATE'){hideLoading();showToast(L.toastDuplicate,'error');autoAdvanceLecture();return;}
    if(text.startsWith('ERROR')){
      if(text.toLowerCase().includes('unauthorized')){hideLoading();showToast(L.toastUnauthorized,'error');setTimeout(doLogout,1200);return;}
      throw new Error(text);
    }
    if(text!=='OK'&&text!=='UPDATED') throw new Error('unexpected');

    if(pendingEditRow){
      clearLocalDup(pendingEditRow.classGroup,pendingEditRow.subject,pendingEditRow.lectureNo);
      pendingEditRow=null;
    }
    markLocalDup();
    const absentCount=allPresent?0:selectedAbsent.size;
    selectedAbsent.clear();
    hideLoading();
    showToast(absentCount===0?L.toastSaved:`${L.toastSaved} (${absentCount})`,'success');
    showLastBanner(absentCount);
    autoAdvanceLecture();
    renderStudents();updateButtons();renderNowCard();
    await loadTodayRows();
  }catch(err){
    hideLoading();
    if(String(err.message).toLowerCase().includes('unauthorized')){
      showToast(L.toastUnauthorized,'error');setTimeout(doLogout,1200);
    }else showToast(L.toastError,'error');
  }
}
function autoAdvanceLecture(){
  const L=LANGS[currentLang];
  const nums=(sel.lecture.match(/\d+/g)||['1']).map(Number);
  let next=Math.max(...nums)+1;
  if(next>6)next=1;
  sel.lecture='Lecture '+next;
  saveSessionState();renderLectureChips();renderNowCard();
  showToast(`${L.nextLecture}: ${sel.lecture}`,'');
}
function showLastBanner(absentCount){
  const L=LANGS[currentLang];
  const b=document.getElementById('lastBanner');
  document.getElementById('lastBannerText').textContent=
    `${L.lastSubmitted}: ${sel.cls} • ${sel.subject} • ${sel.lecture} — ${absentCount} ${L.absentLabel}`;
  b.style.display='flex';
}

// ── recent rows ────────────────────────────────────────
async function loadTodayRows(){
  try{
    const data=await apiGet({action:'getTodayRows'});
    if(!data||data.error) throw new Error(data&&data.error?data.error:'x');
    todayRows=Array.isArray(data.rows)?data.rows:[];
  }catch(err){
    if(String(err.message).toLowerCase().includes('unauthorized')){
      showToast(LANGS[currentLang].toastUnauthorized,'error');setTimeout(doLogout,1200);
    }
  }
  renderRecentRows();
}
function renderRecentRows(){
  const L=LANGS[currentLang];
  const wrap=document.getElementById('recentWrap');
  const body=document.getElementById('recentCardBody');
  document.getElementById('recentCountBadge').textContent=todayRows.length;
  if(!todayRows.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  body.innerHTML=todayRows.map(r=>{
    const names=String(r.absentStudents||'').split(',').map(n=>n.trim()).filter(Boolean);
    const pills=names.length
      ?names.map(n=>`<span class="rt-name-pill"></span>`).join('')
      :`<span class="rt-none">${L.noneAbsent}</span>`;
    const row=document.createElement('div');
    return `<div class="recent-row">
      <div class="rr-main">
        <span class="rt-lecture"></span>
        <span class="rr-info"><b class="rr-subj"></b> • <span class="rr-cls"></span></span>
      </div>
      <div class="rr-pills">${pills}</div>
      <div class="rr-actions">
        <button class="btn-rt-edit" onclick="askEdit(${r.rowNumber})">${L.btnEdit}</button>
        <button class="btn-rt-delete" onclick="askDelete(${r.rowNumber})">${L.btnDelete}</button>
      </div>
    </div>`;
  }).join('');
  // Fill text safely
  const rows=body.querySelectorAll('.recent-row');
  todayRows.forEach((r,i)=>{
    const names=String(r.absentStudents||'').split(',').map(n=>n.trim()).filter(Boolean);
    rows[i].querySelector('.rt-lecture').textContent=r.lectureNo||'—';
    rows[i].querySelector('.rr-subj').textContent=r.subject||'—';
    rows[i].querySelector('.rr-cls').textContent=r.classGroup||'—';
    rows[i].querySelectorAll('.rt-name-pill').forEach((p,j)=>p.textContent=names[j]);
  });
}
function askDelete(rowNumber){
  pendingDeleteRow=rowNumber;pendingEditRow=null;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('show');pendingDeleteRow=null;}
async function executeDelete(){
  if(!pendingDeleteRow)return;
  const rowNumber=pendingDeleteRow;closeConfirm();
  const L=LANGS[currentLang];
  showLoading(L.loadingDel);
  try{
    const resp=await apiGet({action:'deleteRow',rowNumber:String(rowNumber)});
    const text=typeof resp==='string'?resp:'';
    if(text.startsWith('ERROR')){
      if(text.toLowerCase().includes('unauthorized')) throw new Error('Unauthorized');
      throw new Error(text);
    }
    const removed=todayRows.find(r=>r.rowNumber===rowNumber);
    if(removed) clearLocalDup(removed.classGroup,removed.subject,removed.lectureNo);
    todayRows=todayRows.filter(r=>r.rowNumber!==rowNumber);
    hideLoading();showToast(L.toastDeleted,'success');renderRecentRows();
  }catch(err){
    hideLoading();
    if(String(err.message).toLowerCase().includes('unauthorized')){
      showToast(L.toastUnauthorized,'error');setTimeout(doLogout,1200);
    }else showToast(L.toastDelFail,'error');
  }
}
function askEdit(rowNumber){
  const r=todayRows.find(x=>x.rowNumber===rowNumber);
  if(!r)return;
  const L=LANGS[currentLang];
  sel.cls=r.classGroup||'';
  sel.subject=r.subject||'';
  sel.lecture=r.lectureNo||'';
  selectedAbsent=new Set(String(r.absentStudents||'').split(',').map(n=>n.trim()).filter(Boolean));
  pendingEditRow=r;
  renderClassChips();renderSubjectChips();renderLectureChips();
  renderStudents(selectedAbsent);renderNowCard();updateButtons();
  saveSessionState();
  showToast(L.editLoaded,'success');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── init ───────────────────────────────────────────────
async function init(){
  if(!checkAuth())return;
  const L=LANGS[currentLang];
  showLoading(L.loadingData);
  try{
    const data=await apiGet({action:'getTeacherData'});
    if(!data||data.error) throw new Error(data&&data.error?data.error:'x');
    if(data.teacher){currentTeacher=data.teacher;sessionStorage.setItem('aci_teacher',JSON.stringify(currentTeacher));}
    STUDENTS=data.students||{};
    CLASS_SUBJECT_MAP=data.classSubjectMap||{};
    WORKING_DAYS=(Array.isArray(data.workingDays)&&data.workingDays.length)?data.workingDays:WORKING_DAYS;
  }catch(err){
    if(String(err.message).toLowerCase().includes('unauthorized')){
      hideLoading();showToast(L.toastUnauthorized,'error');setTimeout(doLogout,1200);return;
    }
    showToast(L.toastError,'error');
  }
  hideLoading();
  restoreSessionState();
  setLang(currentLang);
  renderClassChips();renderSubjectChips();renderLectureChips();
  document.getElementById('screenSubmit').style.display='';
  document.getElementById('actionBar').style.display='flex';
  await loadTodayRows();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
